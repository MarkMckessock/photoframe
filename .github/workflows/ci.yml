name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: server + shared package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r server/requirements.txt pytest
      - name: Server tests
        run: python -m pytest server/tests -q
      - name: Wire-format conformance
        # Checks the Python encoder against the offsets documented in the *firmware's*
        # header, so the two sides cannot drift apart unnoticed.
        run: python tools/test_format.py

  firmware:
    name: firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Provide a placeholder secrets.h
        # secrets.h is gitignored, but the build needs it to exist.
        run: cp firmware/src/secrets.h.example firmware/src/secrets.h
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pio run -d firmware -e photoframe -e bringup
