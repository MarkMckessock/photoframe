name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: server + shared package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r server/requirements.txt pytest
      - name: Server tests
        run: python -m pytest server/tests -q
      - name: Wire-format conformance
        # Checks the Python encoder against the offsets documented in the *firmware's*
        # header, so the two sides cannot drift apart unnoticed.
        run: python tools/test_format.py

  image:
    name: container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f server/Dockerfile -t photoframe:ci .
      - name: It must actually import and serve
        # The unit tests all pass on a checkout where every file exists. They cannot
        # catch a packaging mistake -- a module missing from the image crashes only in
        # the cluster, on startup, after a deploy. Importing the app inside the built
        # image is the cheapest way to close that gap.
        run: |
          docker run --rm \
            -e TWILIO_ACCOUNT_SID=ACtest -e TWILIO_AUTH_TOKEN=test \
            -e TWILIO_WEBHOOK_URL=http://localhost/mms \
            -e STORE_DIR=/tmp/pf -e MQTT_HOST= \
            --entrypoint python photoframe:ci -c '
          from server.app import app
          c = app.test_client()
          assert c.get("/healthz").status_code == 200
          assert c.get("/latest.pfrm").status_code == 404
          assert c.get("/firmware.json").status_code == 200
          print("image imports and serves")'

  firmware:
    name: firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Provide a placeholder secrets.h
        # secrets.h is gitignored, but the build needs it to exist.
        run: cp firmware/src/secrets.h.example firmware/src/secrets.h
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pio run -d firmware -e photoframe -e bringup
