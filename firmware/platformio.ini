; PlatformIO configuration for the e-ink photo frame.
;
; Board:  Seeed XIAO ESP32-S3 Plus (ESP32-S3R8) on the XIAO ePaper Display Board EE02.
;         16 MB quad SPI flash, 8 MB *octal* SPI PSRAM -> memory_type must be qio_opi.
; Panel:  13.3" E Ink Spectra 6, 1200x1600, 6 colours, no partial refresh.
;         The framebuffer is 1200*1600/2 = 960000 bytes, so PSRAM is mandatory --
;         Seeed_GFX's EPaper constructor ps_calloc()s it at static-init time, before
;         setup() runs. If PSRAM is misconfigured you get a null framebuffer and
;         nothing else in this firmware works.
;
; The pioarduino fork is required: the official espressif32 platform has no
; XIAO ESP32S3 *Plus* board definition and is frozen on Arduino 2.0.x, which lacks
; the ESP-IDF 5.x sleep/OTA APIs this firmware is built on.

[platformio]
src_dir     = src
include_dir = include
lib_dir     = lib
default_envs = photoframe

[env:photoframe]
platform  = https://github.com/pioarduino/platform-espressif32.git#develop
framework = arduino
board     = seeed_xiao_esp32_s3_plus

; The board manifest ships partitions = default_8MB.csv even though the Plus has
; 16 MB. We need dual OTA slots plus a LittleFS partition for the image cache.
board_build.partitions = partitions_photoframe.csv

upload_speed    = 921600
monitor_speed   = 115200
monitor_echo    = yes
monitor_eol     = LF
monitor_filters = esp32_exception_decoder, time

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; GPIO43 is the panel power-enable pin AND the UART0 TX pad. Logging over UART0
    ; would fight the panel rail, so all logging goes over USB CDC.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; 3 = INFO, good for bring-up. Drop to 1 for battery builds.
    -DCORE_DEBUG_LEVEL=3
    -I include

lib_deps =
    https://github.com/Seeed-Studio/Seeed_Arduino_LCD.git
    bertmelis/espMqttClient @ ^1.7.0
    bblanchon/ArduinoJson @ ^7.2.0

extra_scripts = pre:tools/build_version.py

; Wireless upload. Only reachable during a button-3 maintenance window (see net/ota).
[env:photoframe_ota]
extends = env:photoframe
upload_protocol = espota
upload_port = photoframe.local
upload_flags =
    --auth=replace_me!
    --port=3232
    --timeout=30
    --progress

; Bring-up env: panel and sleep only, no radio. Use this for the current
; measurements in stage 2 of the bring-up sequence (see README).
[env:bringup]
extends = env:photoframe
build_flags = ${env:photoframe.build_flags} -DPF_BRINGUP=1
